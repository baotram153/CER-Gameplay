[project]
name = "reasoning"
version = "0.1.0"
description = "Game-rules engine and heuristic action planning for board games."
readme = "README.md"
authors = [
    { name = "baotram153", email = "tramdang7907129@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "common",
    "pyyaml>=6.0",
]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
