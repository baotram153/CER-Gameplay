# Board rectification + track-layout configuration for cờ cá ngựa (Ludo).
#
# `cells:` (below) is generated by
# modules/perception/scripts/generate_ludo_board_config.py - rerun the script for 
# cell position configuration. It encodes the layout actually visible in 
# modules/perception/data/ludo/raw/*.png, not a generic uniform grid.
#
# Double check against your own physical board (aruco marker IDs,
# output_size, and the generated cell centers) — see
# modules/perception/README.md's "Calibration note".

aruco:
  dictionary: DICT_4X4_50
  # No specific order needed, will be determined based on their
  # actual position in the raw image
  corner_marker_ids: [1, 0, 4, 2]

rectification:
  # [width, height] in pixels of the board's own region in the rectified
  # image. Ludo's rectification keeps the whole frame in view so the dice bowl next to
  # the board stays visible too.
  output_size: [800, 800]

track:
  # Number of cells in the shared loop, shared by all 4 colors (includes each
  # color's home_entry cell, which is physically just one of these loop
  # cells).
  num_shared_steps: 60

# entry_offsets[color] is the shared_step of that color's own home_entry
# cell. Counter-clockwise around the photographed board (green top -> blue
# left -> red bottom -> yellow right), evenly spaced 60 / 4 = 15 cells apart.
entry_offsets:
  green: 0
  blue: 15
  red: 30
  yellow: 45

# Physical cell centers in the rectified image, normalized [0, 1] x/y
# relative to the board's own `rectification.output_size` region (not the
# full dice-bowl-inclusive canvas — see perception.ludo.track.load_track_cells).
# kind: "track"        shared loop cell, shared_step 1..num_shared_steps, no color.
#       "home_entry"    shared loop cell (shared_step set, like track) owned by one
#                       color: landing there as that color means Piece.pos == 60.
#       "yard"          color's 4 waiting slots, always Piece.pos == 0.
#       "home_stretch"  color-private final approach, home_step 61..66 (6 cells).
cells:
  - id: track_01
    kind: track
    shared_step: 1
    center: [0.45, 0.095]
