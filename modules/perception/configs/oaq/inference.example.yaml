# Inference-time configuration.

model:
  # Fine-tuned checkpoint, used if present.
  weights: models/best.pt
  # Falls back to the stock Ultralytics checkpoint (auto-downloaded) if
  # `weights` doesn't exist yet, so the pipeline is runnable before any
  # fine-tuning has happened.
  fallback_weights: yolo26n.pt
  conf_threshold: 0.4
  iou_threshold: 0.5
  # null = let Ultralytics auto-select (GPU if available, else CPU).
  device: null
  # Hexagon HTP (NPU) path: when true, ignores weights/fallback_weights/
  # device above and instead runs npu_weights (a quantized ONNX export --
  # see perception.training.export_npu) through onnxruntime's
  # QNNExecutionProvider. Flip back to false to fall back to plain
  # PyTorch/Ultralytics CPU (or CUDA, if available) inference without
  # touching anything else in this file.
  use_npu: false
  npu_weights: models/best.int8.onnx
  # This model is box-only (no pose keypoints).
  num_keypoints: 0
  qnn_backend_path: libQnnHtp.so

class_names:
  0: mandarin_piece
  1: ordinary_piece

board_config: ../common/configs/oaq/board.yaml
