# Inference-time configuration for cờ cá ngựa (Ludo).
#
# One combined YOLO26-pose checkpoint (modules/perception/models/best.pt)
# detects both pawns and the die in a single pass — box + center/head
# keypoints per detection, kpt_shape [2, 3]. Trained via Auto-Labeling's
# configs/yolo26l-pose-2kpt.yaml (a sibling repo, not part of this one).
# The dice bowl sits next to the board in the same raw frame with no corner
# markers of its own, so rectification crops vertically to the board markers
# while preserving the raw frame's aspect ratio and horizontal context for
# the bowl (perception.rectification.rectify_keep_frame).

model:
  weights: models/best.pt
  # No stock-checkpoint fallback: distinguishing pawn colors and dice faces
  # needs the fine-tuned model, so silently running on generic COCO classes
  # would just produce garbage detections. ObjectDetector raises
  # FileNotFoundError instead if `weights` doesn't exist yet.
  fallback_weights: null
  conf_threshold: 0.4
  iou_threshold: 0.5
  # null = let Ultralytics auto-select (GPU if available, else CPU).
  device: null
  # Hexagon HTP (NPU) path: when true, ignores weights/fallback_weights/
  # device above and instead runs npu_weights (a quantized ONNX export --
  # see perception.training.export_npu) through onnxruntime's
  # QNNExecutionProvider. Flip back to false to fall back to plain
  # PyTorch/Ultralytics CPU (or CUDA, if available) inference without
  # touching anything else in this file.
  use_npu: false
  npu_weights: models/best.int8.onnx
  # Must match the checkpoint's kpt_shape (Ludo's pose model: center+head).
  num_keypoints: 2
  qnn_backend_path: libQnnHtp.so
  # Detector class id -> "piece_<color>" | "dice_<1-6>", exactly as baked
  # into the checkpoint at training time (see Auto-Labeling's
  # configs/autolabel.yaml, which these class names were generated from).
  class_names:
    0: piece_red
    1: piece_green
    2: piece_yellow
    3: piece_blue
    4: dice_1
    5: dice_2
    6: dice_3
    7: dice_4
    8: dice_5
    9: dice_6

board_config: ../common/configs/ludo/board.yaml

dice_reading:
  # "model" (default): the die is just one more of the checkpoint's own
  # classes (dice_<1-6> above) -- free, since piece detection already ran
  # this same inference pass. "pip_counting": classical CV instead --
  # crops a fixed ROI and counts pips via adaptive thresholding + contour
  # filtering, ignoring the model's dice_<1-6> classes entirely. Useful as
  # a fallback/cross-check if the model's dice classes turn out unreliable
  # -- see perception.ludo.dice_reader for both implementations. Applies
  # everywhere a die gets read (LudoStatePipeline.run, RollDetector,
  # MovementDetector -- see robot_controller.app.build_engine, which wires
  # this same LudoStatePipeline.dice_reader instance through to all three).
  method: model
  pip_counting:
    # (x, y, w, h) in pixels, in the RECTIFIED frame's coordinate space --
    # i.e. after perception.rectification.rectify_keep_frame, which keeps
    # horizontal context beside the board (the dice bowl) rather than
    # cropping to just the board itself. Re-measure this whenever the
    # camera or board physically moves; log perception.ludo.dice_reader at
    # DEBUG and check pip counts/confidence against a few known rolls
    # before trusting a new ROI.
    roi: [1041, 285, 410, 460]
    # Gaussian-weighted adaptive-threshold window (must be odd) and
    # constant subtracted from it -- see cv2.adaptiveThreshold. Bigger
    # block_size copes with a more gradual lighting falloff across the
    # bowl; bigger c makes the threshold stricter (fewer, darker pixels
    # count as "pip").
    block_size: 51
    c: 10
    # Contour area (px^2, in the ROI's own resolution) a blob must fall
    # within to be considered a pip candidate at all -- filters out both
    # single-pixel noise and the die's own edge/face-boundary contours.
    min_pip_area: 30.0
    max_pip_area: 2000.0
    # 4*pi*area/perimeter^2 -- 1.0 for a perfect circle. A real pip is
    # close to circular; this rejects elongated/irregular contours (a
    # shadow, glare, or two touching pips merged into one blob) that
    # happened to fall in the area range above.
    min_circularity: 0.6
