# Inference-time configuration for cờ cá ngựa (Ludo).
#
# One combined YOLO26-pose checkpoint (modules/perception/models/best.pt)
# detects both pawns and the die in a single pass — box + center/head
# keypoints per detection, kpt_shape [2, 3]. Trained via Auto-Labeling's
# configs/yolo26l-pose-2kpt.yaml (a sibling repo, not part of this one).
# The dice bowl sits next to the board in the same raw frame with no corner
# markers of its own, so rectification crops vertically to the board markers
# while preserving the raw frame's aspect ratio and horizontal context for
# the bowl (perception.rectification.rectify_keep_frame).
#
# This `model` section only applies when dice_reading.method is "model"
# (the default) -- see dice_reading below for the alternative, where
# pieces and dice come from two entirely separate models instead
# (pieces_model + dice_reading.bowl_classifier.classifier).

model:
  weights: models/best.pt
  # No stock-checkpoint fallback: distinguishing pawn colors and dice faces
  # needs the fine-tuned model, so silently running on generic COCO classes
  # would just produce garbage detections. ObjectDetector raises
  # FileNotFoundError instead if `weights` doesn't exist yet.
  fallback_weights: null
  conf_threshold: 0.4
  iou_threshold: 0.5
  # null = let Ultralytics auto-select (GPU if available, else CPU).
  device: null
  # Hexagon HTP (NPU) path: when true, ignores weights/fallback_weights/
  # device above and instead runs npu_weights (a quantized ONNX export --
  # see perception.training.export_npu) through onnxruntime's
  # QNNExecutionProvider. Flip back to false to fall back to plain
  # PyTorch/Ultralytics CPU (or CUDA, if available) inference without
  # touching anything else in this file.
  use_npu: false
  npu_weights: models/best.int8.onnx
  # Must match the checkpoint's kpt_shape (Ludo's pose model: center+head).
  num_keypoints: 2
  qnn_backend_path: libQnnHtp.so
  # Detector class id -> "piece_<color>" | "dice_<1-6>", exactly as baked
  # into the checkpoint at training time (see Auto-Labeling's
  # configs/autolabel.yaml, which these class names were generated from).
  class_names:
    0: piece_red
    1: piece_green
    2: piece_yellow
    3: piece_blue
    4: dice_1
    5: dice_2
    6: dice_3
    7: dice_4
    8: dice_5
    9: dice_6

board_config: ../common/configs/ludo/board.yaml

pieces_model:
  # Only used when dice_reading.method is "bowl_classifier" -- a pose
  # checkpoint fine-tuned on pieces alone (no dice_<1-6> classes at all),
  # used in place of `model` above for piece detection whenever dice
  # reading doesn't come from that same combined checkpoint. Same schema
  # as `model`; train it the same way (Auto-Labeling, a sibling repo),
  # just against a piece-only class set. Ignored entirely when
  # dice_reading.method is "model".
  weights: models/pieces_only.pt
  fallback_weights: null
  conf_threshold: 0.4
  iou_threshold: 0.5
  device: null
  use_npu: false
  npu_weights: models/pieces_only.int8.onnx
  num_keypoints: 2
  qnn_backend_path: libQnnHtp.so
  class_names:
    0: piece_red
    1: piece_green
    2: piece_yellow
    3: piece_blue

dice_reading:
  # "model" (default): the die is just one more of the combined
  # checkpoint's own classes (dice_<1-6> above) -- free, since piece
  # detection already ran this same inference pass. "bowl_classifier":
  # classical CV to find the ROI, a model to read it -- locates the dice
  # bowl itself each frame (Hough Circle Transform against its rim) and
  # hands that crop to a separate, dedicated dice-classification
  # checkpoint, ignoring the combined model's dice_<1-6> classes entirely
  # -- see perception.ludo.dice_reader for both implementations. Applies
  # everywhere a die gets read (LudoStatePipeline.run, RollDetector,
  # MovementDetector -- see robot_controller.app.build_engine, which wires
  # this same LudoStatePipeline.dice_reader instance through to all
  # three). Switching to "bowl_classifier" also switches piece detection
  # over to the separate `pieces_model` above, instead of the combined
  # checkpoint `model` describes.
  method: model
  bowl_classifier:
    # Rather than assuming a fixed pixel crop, this locates the dice
    # bowl's own circular rim each frame via Hough Circle Transform -- the
    # bowl is a separate physical object from the board and can be
    # repositioned independently of it, so a fixed crop drifts out of
    # alignment the moment either one moves (confirmed against real
    # footage: a fixed ROI missed the bowl in roughly half of a 93-image
    # test set spanning two camera setups). bowl_min_radius/bowl_max_radius
    # are the bowl's expected pixel size -- camera-distance-dependent,
    # recalibrate for a different setup. Validated: the strongest Hough
    # candidate was the correct bowl in all 93 test images, 0 misses.
    bowl_min_radius: 100
    bowl_max_radius: 200
    # Optional (x, y, w, h) to restrict the bowl search to, for speed or to
    # avoid an unrelated circular object elsewhere in frame. null = search
    # the whole rectified frame, which was sufficient in testing.
    search_region: null
    # How much bigger than the bowl's own diameter to crop around it --
    # needs enough margin that an off-center die is never clipped.
    bowl_crop_scale: 1.7
    # Reject a classification below this confidence rather than trusting
    # it -- 0.0 trusts the classifier's top1 unconditionally.
    min_confidence: 0.5

    classifier:
      # A YOLO classification checkpoint (not a detector/pose model),
      # fine-tuned to read a die's face value from exactly the kind of
      # bowl crop bowl_crop_scale above produces -- see Auto-Labeling (a
      # sibling repo) for how it's trained.
      weights: models/dice_classifier.pt
      fallback_weights: null
      device: null
      # Classifier class id -> "dice_<1-6>", exactly as baked into the
      # checkpoint at training time.
      class_names:
        0: dice_1
        1: dice_2
        2: dice_3
        3: dice_4
        4: dice_5
        5: dice_6
